# Secret guard: blocks commits that would publish credentials.
# Activate once per clone, with the default branch's reviewed script (re-run it after this
# file or the script changes there):
#   pipx install pre-commit==4.7.0
#   s=$(PATH=/usr/local/bin:/usr/bin:/bin:/opt/homebrew/bin git show refs/remotes/origin/HEAD:.secret-guard/activate.sh) && /bin/sh -c "$s" activate
# The hook reads copies of this file and of the gitleaks policy kept in the git directory
# and refuses a checked-out or staged .gitleaksignore, so a checked-out branch (a fork PR)
# cannot redefine what runs on commit. Do not use plain `pre-commit install`: its hook reads
# the checked-out file.
#
# Why: Claude Code saves approved shell commands verbatim (tokens included) to
# .claude/settings.local.json. .gitignore does not stop `git add -f`, a fresh clone
# without the global ignore, or a file created before the ignore rule existed.
#
# Pre-commit config for gramps-testbed itself.
#
# Lives at repo root (standard pre-commit layout) so cloning the
# testbed + activating it as the secret-guard header above says is the only setup needed.
# The gramps and addons-source fork configs live under
# agent-work/dev-tooling/pre-commit/ and are installed via install.sh.
#
# testbed CI does not have a formal lint gate, but the same E9/F63/F7/F82
# set the addons-source CI uses catches the bugs that ruined two PRs in
# session 2026-05-26 (PR 2334 lint, PR 2335 missing test fixture
# attribute -- the latter would have surfaced only on test run, not lint).

default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.0
    hooks:
      - id: black
        args: ["--check", "--diff"]
        files: \.py$
        # agent-work/ holds committed evidence artifacts (one-off repro
        # scripts captured as-run), not maintained source — exempt from
        # the source-formatting/lint gates, like agent-work/data and
        # agent-work/notes are from version control.
        exclude: ^agent-work/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        # The hook's entry is `ruff check --force-exclude` -- pass only
        # the additional flags via args.
        args:
          - --select=E9,F63,F7,F82
          - --no-fix
        files: \.py$
        exclude: ^agent-work/

  - repo: local
    hooks:
      - id: py-syntax
        name: ast.parse (catch SyntaxError before commit)
        language: system
        entry: python3 -c "import ast,sys;[ast.parse(open(p).read(),p) for p in sys.argv[1:]]"
        files: \.py$
        exclude: ^agent-work/

  # Secret guard. Why: Claude Code saves approved shell commands verbatim (tokens
  # included) to .claude/settings.local.json, and .gitignore does not stop `git add -f`.
  - repo: local
    hooks:
      - id: forbid-machine-local-files
        name: forbid machine-local files (Claude local settings, credentials)
        language: fail
        entry: "machine-local file, may hold recorded commands with secrets; never commit it (git restore --staged <path>)"
        files: '(^|/)(\.claude/settings\.local\.json[^/]*|CLAUDE\.local\.md|\.credentials\.json|\.env)$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
        args: [--ignore-gitleaks-allow]   # a branch's `gitleaks:allow` comments are not trusted
      # Scans the staged blobs themselves, as Git will commit them: the hook above reads
      # `git diff`, which a branch's .gitattributes can turn into "Binary files differ"
      # (`-diff`), and an encoding attribute can make the checkout differ from the index.
      # No filename reaches gitleaks, so none can be read as an option; ":0:" names stage 0
      # explicitly, so a filename containing a colon cannot select another blob.
      - id: gitleaks
        alias: gitleaks-staged-blobs
        name: Detect hardcoded secrets (staged blobs, git attributes ignored)
        entry: sh -c 'for f in "$@"; do git cat-file -e ":0:$f" || exit 1; git cat-file blob ":0:$f" | gitleaks stdin --no-banner --redact --ignore-gitleaks-allow || exit 1; done' --
        pass_filenames: true
        types: [file]
